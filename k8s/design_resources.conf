# Per-design resource overrides for Kubernetes Jobs submitted by k8s/run.sh.
#
# Format
# ------
# Each non-comment line is:
#   <design_id> KEY=VALUE [KEY=VALUE ...]
#
# Where <design_id> is one of:
#   defaults                — fallback for any design without its own entry
#   <platform>/<design>     — exact match (e.g. asap7/bp_quad)
#
# Recognized keys:
#   cpu_req cpu_lim         — CPU cores
#   mem_req mem_lim         — memory (Ki/Mi/Gi)
#   eph_req eph_lim         — ephemeral storage (Ki/Mi/Gi)
#
# Lookup order
# ------------
# For each design, run.sh tries `<platform>/<design>` first, then `defaults`,
# then a hard-coded fallback. Command-line --cpu / --mem flags override
# everything below.
#
# Sizing policy (NRP, 2026-11)
# ----------------------------
# NRP enforces utilization against REQUESTS (CPU must run at 20-200% of
# request, memory at 20-150%; >4 pods out of band risks the account) and
# requires limits within 20% of requests (limit == request at sweep scale).
# So every entry here sets limit == request, and requests are sized to the
# design's measured peak plus modest headroom — NOT to a generic ceiling.
# Memory requests must still fit the worst stage (usually detailed route or
# synth) because the limit is the OOM line.  Per-design peaks noted inline.
# A future improvement is phase-splitting (light stages / wide route as
# separate jobs via PVC checkpoint) so each job has a flat profile.

# Defaults: medium designs (cnn, vortex, litepci, nyuzi, floonoc, bp_uno,
# NVDLA a/m/o/p, coralnpu-a7/n45): peaks ~8-20 GB (bp_uno measured ~17 GB).
defaults              cpu_req=4 cpu_lim=4 mem_req=24Gi mem_lim=24Gi eph_req=100Gi eph_lim=100Gi

# Tiny designs: peaks of a few GB; a 24Gi request would sit under the 20%
# memory utilization floor.
asap7/lfsr            mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
nangate45/lfsr        mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
sky130hd/lfsr         mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
asap7/minimax         mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
nangate45/minimax     mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
sky130hd/minimax      mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
asap7/sha3            mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
nangate45/sha3        mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
sky130hd/sha3         mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
asap7/liteeth         mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
nangate45/liteeth     mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
sky130hd/liteeth      mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
asap7/litedram        mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
nangate45/litedram    mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi
sky130hd/litedram     mem_req=8Gi mem_lim=8Gi eph_req=50Gi eph_lim=50Gi

# 4-core BlackParrot — measured 113 GB peak in 5_2_route, 51 GB in 4_cts;
# ephemeral exceeded 50Gi at 8h into 3_place. Route is threaded, so the
# wider CPU request stays above the floor during the dominant stage.
asap7/bp_quad         cpu_req=8 cpu_lim=8 mem_req=128Gi mem_lim=128Gi eph_req=200Gi eph_lim=200Gi
nangate45/bp_quad     cpu_req=8 cpu_lim=8 mem_req=128Gi mem_lim=128Gi eph_req=200Gi eph_lim=200Gi

# Single-core BlackParrot — ~17 GB peak (fits defaults) but CTS leaves
# multi-GB intermediate ODBs in the sandbox.
asap7/bp_uno          eph_req=150Gi eph_lim=150Gi
nangate45/bp_uno      eph_req=150Gi eph_lim=150Gi
sky130hd/bp_uno       eph_req=150Gi eph_lim=150Gi

# Gemmini — 48Gi measured necessary (33b069c3, timing closed with it in
# 45b54bd1).
asap7/gemmini         mem_req=48Gi mem_lim=48Gi
nangate45/gemmini     mem_req=48Gi mem_lim=48Gi
sky130hd/gemmini      mem_req=48Gi mem_lim=48Gi

# nyuzi — 934k instances, 2.8GB artifacts; sandbox holds large ODBs.
asap7/nyuzi           eph_req=150Gi eph_lim=150Gi
nangate45/nyuzi       eph_req=150Gi eph_lim=150Gi

# FloonNoC — all-std-cell, moderate memory, heavy sandbox state.
asap7/floonoc         eph_req=150Gi eph_lim=150Gi
nangate45/floonoc     eph_req=150Gi eph_lim=150Gi
sky130hd/floonoc      eph_req=150Gi eph_lim=150Gi

# Snitch Cluster — 1.5M cells; the 2026-11 resizer's place_gp passes are
# memory-hungry on designs this size.
asap7/snitch_cluster  mem_req=48Gi mem_lim=48Gi eph_req=150Gi eph_lim=150Gi
nangate45/snitch_cluster mem_req=48Gi mem_lim=48Gi eph_req=150Gi eph_lim=150Gi

# CoralNPU — balloons on sky130hd relative to asap7.
asap7/coralnpu        eph_req=150Gi eph_lim=150Gi
nangate45/coralnpu    eph_req=150Gi eph_lim=150Gi
sky130hd/coralnpu     mem_req=48Gi mem_lim=48Gi eph_req=150Gi eph_lim=150Gi

# NVDLA partition_c — the largest NVDLA partition; history of OOM/debug.
asap7/partition_c     mem_req=48Gi mem_lim=48Gi eph_req=150Gi eph_lim=150Gi
nangate45/partition_c mem_req=48Gi mem_lim=48Gi eph_req=150Gi eph_lim=150Gi
sky130hd/partition_c  mem_req=48Gi mem_lim=48Gi eph_req=150Gi eph_lim=150Gi

# Ternip 'Ethan' config — OOM'd (exit 137) in synth at a 128Gi limit on
# 2026-05-19, so the peak is 128-192 GB; request must carry it.
asap7/ternip          mem_req=192Gi mem_lim=192Gi eph_req=150Gi eph_lim=150Gi
nangate45/ternip      mem_req=192Gi mem_lim=192Gi eph_req=150Gi eph_lim=150Gi
sky130hd/ternip       mem_req=192Gi mem_lim=192Gi eph_req=150Gi eph_lim=150Gi

# Eyeriss v2 — 193 macros drive route into the 80-90 GB range.
asap7/eyeriss         cpu_req=8 cpu_lim=8 mem_req=96Gi mem_lim=96Gi eph_req=200Gi eph_lim=200Gi
nangate45/eyeriss     cpu_req=8 cpu_lim=8 mem_req=96Gi mem_lim=96Gi eph_req=200Gi eph_lim=200Gi
sky130hd/eyeriss      cpu_req=8 cpu_lim=8 mem_req=96Gi mem_lim=96Gi eph_req=200Gi eph_lim=200Gi
