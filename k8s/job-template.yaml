apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: vlsida
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      initContainers:
      - name: clone-repo
        image: alpine/git
        command: ["sh", "-c"]
        args:
        - |
          set -e
          git clone --single-branch --branch __BRANCH__ --depth=1 \
            https://github.com/VLSIDA/HighTide.git /repo
          cd /repo
          git submodule update --init --depth=1 bazel-orfs
          # Init this design's dev/ submodules too (under designs/src/<d>/dev/*).
          # Most designs have a committed rtl_release filegroup and don't need
          # this, but designs whose Bazel targets reference dev/repo/...
          # directly (e.g. ternip's BSG-driven flow) need a cold-build to find
          # them on disk.  Cached actions ignore the submodule contents.
          DESIGN=$(echo "__BAZEL_TARGET__" | sed -n 's|^//designs/[^/]*/\([^:]*\):.*|\1|p')
          if [ -n "$DESIGN" ]; then
            git config --file .gitmodules --get-regexp \
                "submodule\\.designs/src/${DESIGN}/dev/.*\\.path" 2>/dev/null \
              | awk '{print $2}' \
              | while IFS= read -r sm; do
                  [ -n "$sm" ] && git submodule update --init --depth=1 "$sm" || true
                done
          fi
        volumeMounts:
        - name: repo
          mountPath: /repo
      containers:
      - name: build
        image: ubuntu:24.04
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          # Install dependencies:
          #   curl  — bazelisk download
          #   git   — bazel-orfs fetch
          #   build-essential + libxml2 — link-time deps for Bazel CC toolchain
          #     (ld.lld from toolchains_llvm dlopens libxml2.so.2)
          #   python3/time/numpy/yaml — ORFS flow scripts
          #   libx11-xcb1 + libxcb-* + libxkbcommon-x11-0 — runtime deps for
          #     OpenROAD built with --@openroad//:platform=gui (bazel-orfs .bazelrc);
          #     binary DT_NEEDEDs libX11-xcb.so.1 even when run headlessly
          #   xvfb — provides xvfb-run + a virtual X server so the
          #     <design>_gallery render (xvfb-run + OpenROAD -gui) works
          #     headlessly on k8s; without it the gallery action fails
          #     with "xvfb-run: command not found" (Error 127)
          # default-jre-headless — rules_jvm_external's coursier (maven deps
          #   for the Chisel designs: sha3, gemmini, coralnpu) execs `java`
          #   from PATH during repository fetch; bazel's remotejdk does not
          #   cover repo rules
          apt-get update -qq && apt-get install -y -qq \
            curl git build-essential time libxml2 xvfb awscli \
            default-jre-headless \
            python3 python3-yaml python3-numpy \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libsm6 libice6 \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libegl1 \
            libfontconfig1 libglib2.0-0 \
            >/dev/null 2>&1

          # Install bazelisk as bazel
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel

          cd /repo

          # Build the design with remote cache (upload if credentials available).
          # BAZEL_CACHE_URL is injected from the bazel-cache-creds Secret in the form
          # https://USER:TOKEN@cache.hightide-benchmarks.dev.  When unset (Secret missing
          # or readers without write access), fall back to the public read-only URL.
          if [ -n "${BAZEL_CACHE_URL:-}" ]; then
            echo "Cache credentials found, enabling cache upload"
            CACHE_FLAGS="--remote_cache=$BAZEL_CACHE_URL --remote_upload_local_results=true"
          else
            echo "WARNING: cache credentials not found, cache is read-only"
            CACHE_FLAGS="--remote_cache=https://cache.hightide-benchmarks.dev"
          fi

          # Per-pod disk cache (fresh emptyDir): everything this job executes
          # lands here, so the post-build S3 backfill below can publish the
          # blobs too big for the Worker's 100 MB PUT cap.
          CACHE_FLAGS="$CACHE_FLAGS --disk_cache=/disk-cache"

          # When uploading artifacts, force download of all intermediate
          # outputs (logs, reports, results) so we capture them on cache hits.
          if [ "__UPLOAD_ARTIFACTS__" = "true" ]; then
            CACHE_FLAGS="$CACHE_FLAGS --remote_download_outputs=all"
          fi

          # Capture build exit code so we can save artifacts even on failure
          BUILD_RC=0
          bazel build $CACHE_FLAGS __BAZEL_TARGET__ || BUILD_RC=$?

          # Backfill oversized blobs over the R2 S3 API (bazel's own uploads
          # through the Worker 413 above 100 MB and are skipped with a
          # warning).  Runs whenever the r2-s3-creds Secret is present; never
          # fails the job.  The disk cache is this job's output set, so the
          # walk is cheap and objects already in the bucket are skipped.
          if [ -n "${R2_ENDPOINT:-}" ]; then
            echo "Backfilling oversized cache blobs over S3..."
            bash tools/r2-cache/s3-backfill.sh --cache-dir /disk-cache \
              || echo "WARNING: S3 backfill failed (build result unaffected)"
          else
            echo "No r2-s3-creds Secret; skipping oversized-blob backfill"
          fi

          # Copy build artifacts to persistent storage (when enabled)
          if [ "__UPLOAD_ARTIFACTS__" = "true" ]; then
            # Extract design path from bazel target //designs/<platform>/<design>:<name>
            TARGET="__BAZEL_TARGET__"
            DESIGN_PATH="${TARGET#//}"
            DESIGN_PATH="${DESIGN_PATH%%:*}"

            ARTIFACT_DIR="bazel-bin/${DESIGN_PATH}"
            if [ -d "$ARTIFACT_DIR" ]; then
              DEST="/artifacts/${DESIGN_PATH}"
              echo "Copying build artifacts to $DEST..."
              rm -rf "$DEST"
              mkdir -p "$DEST"
              # Resolve symlinks (bazel-bin is a symlink tree to bazel-out)
              cp -rL "$ARTIFACT_DIR"/* "$DEST/" 2>/dev/null || true
              # Remove runfiles (not useful for debug)
              find "$DEST" -name '*.runfiles' -type d -exec rm -rf {} + 2>/dev/null || true
              find "$DEST" -name '*.runfiles_manifest' -delete 2>/dev/null || true
              echo "Artifacts saved to $DEST/"
              du -sh "$DEST"
            else
              echo "WARNING: artifact directory $ARTIFACT_DIR not found"
            fi
          fi

          exit $BUILD_RC
        env:
        - name: BAZEL_CACHE_URL
          valueFrom:
            secretKeyRef:
              name: bazel-cache-creds
              key: url
              optional: true
        # R2 S3 API credentials for the oversized-blob backfill (optional;
        # jobs without the Secret just skip the backfill step).
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: r2-s3-creds
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: r2-s3-creds
              key: AWS_SECRET_ACCESS_KEY
              optional: true
        - name: R2_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: r2-s3-creds
              key: R2_ENDPOINT
              optional: true
        volumeMounts:
        - name: repo
          mountPath: /repo
        - name: disk-cache
          mountPath: /disk-cache
        - name: artifacts
          mountPath: /artifacts
        resources:
          requests:
            memory: __MEM_REQUEST__
            cpu: __CPU_REQUEST__
            ephemeral-storage: __EPH_REQUEST__
          limits:
            memory: __MEM_LIMIT__
            cpu: __CPU_LIMIT__
            ephemeral-storage: __EPH_LIMIT__
      volumes:
      - name: repo
        emptyDir: {}
      - name: disk-cache
        emptyDir: {}
      - name: artifacts
        persistentVolumeClaim:
          claimName: hightide-artifacts
      restartPolicy: Never
